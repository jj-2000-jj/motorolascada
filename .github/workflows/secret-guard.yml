name: Secret guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check new commits for credentials
        env:
          BASELINE_SHA: "7263436b79ee85065e22e1c9ae39777ac09f9d14"
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="$EVENT_BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$BASELINE_SHA"
          fi
          export SCAN_BASE_SHA="$base"
          python3 - <<'PY'
          import os, pathlib, subprocess
          names = subprocess.check_output([
              "git", "diff", "--name-only", "--diff-filter=ACMR", "-z",
              os.environ["SCAN_BASE_SHA"], "HEAD", "--"
          ]).decode().split("\0")
          blocked = [name for name in names if name and (
              pathlib.PurePosixPath(name).name == ".env" or (
                  pathlib.PurePosixPath(name).name.startswith(".env.") and
                  not pathlib.PurePosixPath(name).name.endswith((".example", ".sample", ".template"))
              )
          )]
          if blocked:
              raise SystemExit("Runtime environment files must stay untracked: " + ", ".join(blocked))
          PY
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 2 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --no-banner --ignore-gitleaks-allow --timeout 120 --log-opts="$SCAN_BASE_SHA..HEAD" .
